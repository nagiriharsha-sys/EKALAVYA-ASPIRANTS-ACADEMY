<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekalavya Aspirants Academy - Study Materials</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1e3a8a;
            text-align: center;
        }
        .pdf-viewer {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 15px;
        }
        .btn-box {
            text-align: center;
            margin-top: 20px;
        }
        .download-btn {
            background-color: #2563eb;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
        }
        .download-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ekalavya Aspirants Academy</h1>
        <p>APPSC & TGPSC Free Study Materials & Daily Current Affairs</p>
    </header>

    <div class="container">
        <h2>ప్రతిరోజూ అప్డేట్ అయ్యే స్టడీ మెటీరియల్</h2>
        <p style="text-align: center; color: #555;">కింద ఇచ్చిన పీడీఎఫ్ ను మీరు నేరుగా వెబ్‌సైట్‌లోనే చదువుకోవచ్చు లేదా డౌన్‌లోడ్ చేసుకోవచ్చు.</p>

        <!-- వెబ్‌సైట్ లోపలే నేరుగా PDF కనిపించే కోడ్ -->
        <iframe src="40.pdf" class="pdf-viewer"></iframe>

        <div class="btn-box">
            <a href="40.pdf" target="_blank" class="download-btn">📥 పూర్తి స్క్రీన్ లో డౌన్‌లోడ్ / వీక్షించండి</a>
        </div>
    </div>

</body>
</html>
